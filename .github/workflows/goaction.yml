name: Go Action

on: [push, pull_request]

jobs:
  goaction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --verbose

      - name: Run golangci-lint routine
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --verbose
          working-directory: routine

      - name: Run golangci-lint inflight
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --verbose
          working-directory: inflight

      - name: Run go test
        run: go test -race ./...

      - name: Run go test routine
        run: cd ./routine && go test -race ./...

      - name: Run go test inflight
        run: cd ./inflight && go test -race ./...
